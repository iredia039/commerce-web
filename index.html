<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelfmark — Product Demo</title>
  <link rel="stylesheet" href="public/output.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
 
  <!-- ============ TOP NAV ============ -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="text-xl font-bold tracking-tight text-slate-900">Shelfmark</h1>
 
      <nav class="flex items-center gap-2">
        <button id="nav-store-btn"
          class="px-4 py-2 rounded-md text-sm font-medium bg-slate-900 text-white">
          Store
        </button>
        <button id="nav-admin-btn"
          class="px-4 py-2 rounded-md text-sm font-medium text-slate-600 hover:bg-slate-100">
          Admin
        </button>
      </nav>
    </div>
  </header>
 
  <!-- ============ TOAST (shared) ============ -->
  <div id="toast"
    class="hidden fixed top-4 right-4 z-50 px-4 py-3 rounded-md shadow-lg text-sm font-medium text-white">
  </div>
 
  <main class="max-w-6xl mx-auto px-4 py-6">
 
    <!-- ================================================================ -->
    <!-- STORE VIEW                                                        -->
    <!-- ================================================================ -->
    <section id="store-view">
 
      <!-- Controls: search + category filter -->
      <div class="flex flex-col sm:flex-row gap-3 mb-6">
        <input id="search-input" type="text" placeholder="Search products..."
          class="flex-1 px-4 py-2 rounded-md border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-400" />
 
        <select id="category-select"
          class="px-4 py-2 rounded-md border border-slate-300 bg-white focus:outline-none focus:ring-2 focus:ring-slate-400">
          <option value="">All categories</option>
          <!-- JS: populate <option> tags from /products/categories -->
        </select>
      </div>
 
      <!-- Loading / empty states -->
      <p id="store-status" class="text-slate-500 text-sm mb-4 hidden"></p>
 
      <!-- Product grid -->
      <div id="product-grid"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
        <!-- JS: inject product cards here -->
      </div>
 
      <!-- Pagination -->
      <div id="pagination" class="flex items-center justify-center gap-2 mt-8">
        <!-- JS: inject Prev / page numbers / Next here -->
      </div>
    </section>
 
    <!-- ================================================================ -->
    <!-- PRODUCT DETAIL MODAL                                              -->
    <!-- ================================================================ -->
    <div id="detail-modal" class="hidden fixed inset-0 z-40 bg-black/50 flex items-center justify-center p-4">
      <div class="bg-white rounded-lg max-w-2xl w-full max-h-[85vh] overflow-y-auto p-6 relative">
        <button id="detail-close-btn"
          class="absolute top-4 right-4 text-slate-400 hover:text-slate-700">&#10005;</button>
        <div id="detail-content">
          <!-- JS: inject product detail here -->
        </div>
      </div>
    </div>
 
    <!-- ================================================================ -->
    <!-- ADMIN VIEW                                                        -->
    <!-- ================================================================ -->
    <section id="admin-view" class="hidden">
 
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold text-slate-900">Admin Dashboard</h2>
        <button id="add-product-btn"
          class="px-4 py-2 rounded-md text-sm font-medium bg-slate-900 text-white hover:bg-slate-700">
          + Add product
        </button>
      </div>
 
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
 
        <!-- Admin product table -->
        <div class="lg:col-span-2 bg-white rounded-lg border border-slate-200 overflow-hidden">
          <table class="w-full text-sm">
            <thead class="bg-slate-100 text-slate-600 text-left">
              <tr>
                <th class="px-4 py-3">Product</th>
                <th class="px-4 py-3">Category</th>
                <th class="px-4 py-3">Price</th>
                <th class="px-4 py-3">Stock</th>
                <th class="px-4 py-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="admin-table-body">
              <!-- JS: inject admin rows here (each row: quick-edit inputs + Edit/Delete buttons) -->
            </tbody>
          </table>
        </div>
 
        <!-- Activity log -->
        <div class="bg-white rounded-lg border border-slate-200 p-4">
          <h3 class="font-semibold text-slate-900 mb-3">Activity Log</h3>
          <ul id="activity-log" class="space-y-2 text-sm text-slate-600 max-h-[28rem] overflow-y-auto">
            <!-- JS: inject log entries here, newest first -->
          </ul>
        </div>
      </div>
    </section>
 
    <!-- ================================================================ -->
    <!-- ADD / EDIT PRODUCT MODAL (admin)                                  -->
    <!-- ================================================================ -->
    <div id="product-form-modal" class="hidden fixed inset-0 z-40 bg-black/50 flex items-center justify-center p-4">
      <div class="bg-white rounded-lg max-w-md w-full p-6 relative">
        <button id="form-close-btn"
          class="absolute top-4 right-4 text-slate-400 hover:text-slate-700">&#10005;</button>
        <h3 id="product-form-title" class="text-lg font-semibold text-slate-900 mb-4">Add product</h3>
 
        <form id="product-form" class="space-y-3">
          <input type="hidden" id="product-form-id" />
 
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Title</label>
            <input id="product-form-title-input" type="text" required
              class="w-full px-3 py-2 rounded-md border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-400" />
          </div>
 
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Category</label>
            <input id="product-form-category" type="text" required
              class="w-full px-3 py-2 rounded-md border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-400" />
          </div>
 
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Price</label>
              <input id="product-form-price" type="number" step="0.01" required
                class="w-full px-3 py-2 rounded-md border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-400" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Stock</label>
              <input id="product-form-stock" type="number" required
                class="w-full px-3 py-2 rounded-md border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-400" />
            </div>
          </div>
 
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Description</label>
            <textarea id="product-form-description" rows="3"
              class="w-full px-3 py-2 rounded-md border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-400"></textarea>
          </div>
 
          <button type="submit"
            class="w-full mt-2 px-4 py-2 rounded-md text-sm font-medium bg-slate-900 text-white hover:bg-slate-700">
            Save
          </button>
        </form>
      </div>
    </div>
 
  </main>
 
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
